name: Build the Windows app

# Builds Crawlmates.exe (portable) and an installer from the current game files, including config.js,
# so the desktop app talks to the same marketplace as the website.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.1 to also publish a GitHub Release.

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set the app version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        shell: bash
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      - name: Install the build tools
        working-directory: desktop
        run: npm ci

      - name: Build Crawlmates.exe
        working-directory: desktop
        run: npm run build:win

      - name: Keep the files on this run
        uses: actions/upload-artifact@v4
        with:
          name: Crawlmates-Windows
          path: desktop/dist/*.exe

      - name: Publish a release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
